
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'bytebuddies_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'bytebuddies_dbt'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

vars:
  timezone: "{{ env_var('APP_TIMEZONE', 'Europe/Helsinki') }}"
  shop_open: "{{ env_var('SHOP_OPEN_HOUR', '7') | float }}"
  shop_close: "{{ env_var('SHOP_CLOSE_HOUR', '22') | float }}"
  max_x_cm: "{{ env_var('STORE_WIDTH_M', '104.06') | float * 100 }}"
  max_y_cm: "{{ env_var('STORE_HEIGHT_M', '52.20') | float * 100 }}"
  checkout_x_min: "{{ env_var('CHECKOUT_X_MIN', '0.0') | float * 100 }}"
  checkout_x_max: "{{ env_var('CHECKOUT_X_MAX', '7.0') | float * 100 }}"
  checkout_y_min: "{{ env_var('CHECKOUT_Y_MIN', '0.0') | float * 100 }}"
  checkout_y_max: "{{ env_var('CHECKOUT_Y_MAX', '20.0') | float * 100 }}"
  
  # Problemaattiset ympyräalueet (cm)
  prob1_x: "{{ env_var('PROB1_X', '100') | float }}"
  prob1_y: "{{ env_var('PROB1_Y', '2500') | float }}"
  prob1_r: "{{ env_var('PROB1_R', '400') | float }}"
  prob2_x: "{{ env_var('PROB2_X', '900') | float }}"
  prob2_y: "{{ env_var('PROB2_Y', '3600') | float }}"
  prob2_r: "{{ env_var('PROB2_R', '600') | float }}"
  
  # Kynnysarvot (Vastaten notebooks/01_03_data_exploration.ipynb)
  q_threshold: "{{ env_var('Q_THRESHOLD', '0.0') | float }}"
  session_gap_threshold: "{{ env_var('SESSION_GAP_SECONDS', '900') | float }}"
  max_jump_speed: "{{ env_var('MAX_JUMP_SPEED_MPS', '3.0') | float }}"
  
  # ALOITUSALUEEN VAATIMUKSET (metreinä)
  start_zone_x_min: "{{ env_var('START_ZONE_X_MIN', '0.0') | float }}"
  start_zone_x_max: "{{ env_var('START_ZONE_X_MAX', '12.0') | float }}"
  start_zone_y_min: "{{ env_var('START_ZONE_Y_MIN', '22.0') | float }}"
  start_zone_y_max: "{{ env_var('START_ZONE_Y_MAX', '34.0') | float }}"
  
  # FYSIOLOGISET JA LIIKETOIMINNALLISET RAJAT
  min_session_points: 30
  min_session_dist_m: 30.0
  max_session_dist_m: 8000.0
  min_session_time_s: 180
  max_session_time_s: 14400
  min_avg_speed_mps: 0.08
  max_avg_speed_mps: 1.5
  min_spatial_spread_m: 15.0
  
  # PAIKALLAANOLO-LEIKKURI (Stationary Cutter)
  stationary_timeout_min: 20
  stationary_radius_m: 5.0

models:
  bytebuddies_dbt:
    bronze:
      +materialized: table
    silver:
      +materialized: table
    gold:
      +materialized: table

