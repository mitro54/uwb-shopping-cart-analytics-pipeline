version: 2

models:
  - name: f_kaynti
    description: "Yksi rivi per uniikki kauppakäynti (sessio). Sisältää keston, matkan ja keskinopeuden."
    columns:
      - name: kaynti_id
        description: "Uniikki sessiotunniste (full_session_id)."
        tests:
          - unique
          - not_null
      - name: node_id
        description: "Kärryn tunniste."
      - name: alku
        description: "Käynnin alkuaika."
      - name: loppu
        description: "Käynnin loppuaika."
      - name: kesto_sekunteina
        description: "Käynnin kesto (s)."
      - name: matka
        description: "Käynnin aikana kuljettu matka (m)."
      - name: keskinopeus
        description: "Käynnin keskinopeus (m/s)."
      - name: kaynti_paiva
        description: "Asioinnin päivämäärä."
      - name: kaynti_tunti
        description: "Asioinnin aloitustunti (0-23)."
      - name: kaynti_viikonpaiva
        description: "Asioinnin viikonpäivä (1=Ma..7=Su)."

  - name: dim_karry
    description: "Kärrydimensio: Yksilölliset kärryt ja niiden elinkaari."
    columns:
      - name: node_id
        description: "Uniikki kärryn tunniste."
        tests:
          - unique
          - not_null
      - name: snro
        description: "Luettava kärryn sarjanumero (esim. 'Kärry 123')."

  - name: f_osastokaynti
    description: "Yksi rivi per osastokäynti per sessio. Yhdistää sijaintidataa osastojen koordinaatteihin."
    columns:
      - name: kaynti_id
        description: "Uniikki sessiotunniste."
      - name: node_id
        description: "Kärryn tunniste."
      - name: osasto_id
        description: "Osaston sisäinen tunniste."
      - name: osaston_nimi
        description: "Osaston nimi (esim. 'Maito', 'Hevi')."
      - name: osasto_sisaantulo
        description: "Milloin kärry saapui osastolle."
      - name: osasto_poistuminen
        description: "Milloin kärry poistui osastolta."
      - name: vietetty_aika_sekunteina
        description: "Osastolla vietetty aika (s)."

  - name: f_verkko_laatu
    description: "Kuumuuskarttatyyppinen (Heatmap) faktataulu, joka kokoaa signaalinlaadun 1x1 metrin ruudukkoon (grid). Käytetään katvealueiden paikannukseen."
    columns:
      - name: grid_x
        description: "Koordinaattiruudun x-arvo (aloitus x)."
      - name: grid_y
        description: "Koordinaattiruudun y-arvo (aloitus y)."
      - name: median_quality
        description: "Ruudussa mitattu signaalin laadun mediaani (q, 0–255)."
      - name: low_quality_pct
        description: "Prosenttiosuus heikoista (q<35) signaaleista kyseisessä ruudussa."

  - name: gold_koordinaatit
    description: >
      Puhdistettu ja rikastettu koordinaattitaulu lämpökarttatuotantoon.
      Lähde: silver_positions. Poistettu tekninen haamudata myymälän ulkoseiniltä (mm. sisääntulo ja kärryt, oikean reunan yli tursuava data, sekä ylä- ja alanurkkien lovet).
      Aggregoitu 100 cm × 100 cm ruudukkoon. Yksi rivi per grid-ruutu.
    columns:
      - name: grid_x
        description: "Ruudukon x-koordinaatti (senttimetreinä, pyöristetty 100 cm:n tarkkuuteen)."
        tests:
          - not_null
      - name: grid_y
        description: "Ruudukon y-koordinaatti (senttimetreinä, pyöristetty 100 cm:n tarkkuuteen)."
        tests:
          - not_null
      - name: osasto_id
        description: "Osaston tunniste (NULL, jos ruutu ei osu yhdenkään osaston alueelle)."
      - name: osasto_nimi
        description: "Osaston nimi (esim. 'Elintarvikkeet'). NULL jos ei osastoa."
      - name: kokonaisviipyma_s
        description: "Kaikkien pysähdysten yhteen laskettu kesto ruudussa (sekunteina). Lämpökartan päämetriikka."
        tests:
          - not_null
      - name: pysahdysten_maara
        description: "Kuinka monta pysähdystapahtumaa osui tähän ruutuun."
      - name: uniikkeja_karrya
        description: "Kuinka monta eri kärryä pysähtyi tässä ruudussa."
      - name: keskiviipyma_s
        description: "Pysähdysten keskimääräinen kesto ruudussa (sekunteina)."

  - name: f_laite_status
    description: "Päivätason aggregaatti jokaisen laitteen (kärryn) tilasta, virheistä ja heikoista signaaleista verkon toiminnan monitorointiin."
    columns:
      - name: node_id
        description: "Kärryn tunniste."
      - name: pvm
        description: "Pisteiden päivämäärä."
      - name: error_rate_pct
        description: "Kuinka monta prosenttia laitteen pingauksista päivän aikana sisälsi jotain vikaa (heikko signaali, jitter tai ulkona kaupasta)."

  - name: f_paikannustarkkuus
    description: >
      Yöaikainen paikannustarkkuusanalyysi paikallaan olleille laitteille.
      Grain: yksi rivi per laite (node_id) per yö (yo_paiva).
      Käytetään UWB-paikannusjärjestelmän tarkkuuden arviointiin sijaintihajonnan perusteella.
    columns:
      - name: yo_paiva
        description: "Yön aloituspäivä (se ilta jona yö alkoi)."
        tests:
          - not_null
      - name: node_id
        description: "Kärryn tunniste."
        tests:
          - not_null
      - name: n_pings
        description: "Havaintojen lukumäärä yön aikana."
      - name: centroid_x
        description: "Laitteen sijaintipilven keskipisteen x-koordinaatti (cm)."
      - name: centroid_y
        description: "Laitteen sijaintipilven keskipisteen y-koordinaatti (cm)."
      - name: std_x
        description: "Sijaintihajonnan keskihajonta x-akselilla (cm)."
      - name: std_y
        description: "Sijaintihajonnan keskihajonta y-akselilla (cm)."
      - name: rmse_2d
        description: "2D RMSE-tarkkuus — yhdistetty sijaintihajonta x- ja y-akseleilla (cm)."
      - name: cep50
        description: "CEP50 — säde jonka sisällä 50% havainnoista sijaitsee (cm)."
      - name: cep68
        description: "CEP68 — säde jonka sisällä 68% havainnoista sijaitsee (cm)."
      - name: cep95
        description: "CEP95 — säde jonka sisällä 95% havainnoista sijaitsee (cm)."
      - name: jitter_ka_cm
        description: "Jitterin keskiarvo — peräkkäisten havaintojen välinen keskietäisyys (cm)."
      - name: jitter_p95_cm
        description: "Jitterin 95. persentiili (cm)."
      - name: drift_x_cmh
        description: "Systemaattinen sijaintimuutos x-akselilla yön yli (cm/h). Positiivinen = liikkuu oikealle."
      - name: drift_y_cmh
        description: "Systemaattinen sijaintimuutos y-akselilla yön yli (cm/h). Positiivinen = liikkuu ylöspäin."
      - name: outlier_pct
        description: "Osuus havainnoista jotka poikkeavat yli 2×RMSE keskipisteestä (%)."
      - name: avg_q
        description: "Signaalin laadun keskiarvo yön aikana (0–255)."
      - name: low_quality_pct
        description: "Heikkolaatuisten havaintojen osuus yön aikana (%, q < 35)."
