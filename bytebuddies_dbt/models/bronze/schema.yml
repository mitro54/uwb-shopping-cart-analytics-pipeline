version: 2

models:
  - name: bronze_csv_data
    description: "Alkuperäinen Iiwari-sensoridata ladattuna CSV-tiedostoista. Sisältää aikaleiman, x/y-koordinaatit ja signaalin laadun."
    columns:
      - name: node_id
        description: "Sensorin (esim. kärryn) yksilöllinen tunniste."
        tests:
          - not_null
      - name: timestamp
        description: "Havainnon aikaleima (TIMESTAMPTZ)."
        tests:
          - not_null
      - name: x
        description: "X-koordinaatti (tyypillisesti senttimetreinä)."
      - name: y
        description: "Y-koordinaatti (tyypillisesti senttimetreinä)."
      - name: q
        description: "Signaalin laatu (Quality), tyypillisesti 0-100."
      - name: filename
        description: "CSV-tiedoston nimi, josta data on peräisin."
      - name: latausajankohta
        description: "Aikaleima, jolloin data on ladattu tietokantaan."
