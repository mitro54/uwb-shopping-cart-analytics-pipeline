version: 2

models:
  - name: silver_positions
    description: "Puhdistettu ja rikastettu sijaintidata. Sisältää geofencing-rajaukset, jitter-suodatuksen ja sessionization-logiikan."
    columns:
      - name: node_id
        description: "Kärryn yksilöllinen tunniste."
        tests:
          - not_null
      - name: aika
        description: "Puhdistettu havaintoajankohta."
        tests:
          - not_null  
      - name: x
        description: "X-koordinaatti (cm)."
        tests:
          - not_null
      - name: y
        description: "Y-koordinaatti (cm)."
        tests:
          - not_null
      - name: q
        description: "Signaalin laatu."
        tests:
          - not_null
      - name: session_id
        description: "Kärrykohtainen juokseva sessionumero."
        tests:
          - not_null
      - name: full_session_id
        description: "Maailmanlaajuisesti uniikki MD5-tunniste sessiolle (node_id + session_id)."
        tests:
          - not_null
      - name: dist_m
        description: "Matka edellisestä havainnosta metreinä."
        tests:
          - not_null
      - name: sekuntia_edellisesta
        description: "Aika edellisestä havainnosta sekunteina."
        tests:
          - not_null
      - name: speed_mps
        description: "Laskettu nopeus (m/s)."
        tests:
          - not_null

  - name: silver_device_diagnostics
    description: "IoT-laitteiston diagnostiikkadata. Sisältää kaiken datan laatuongelmineen, ja merkitsee poikkeamat lipuilla."
    columns:
      - name: node_id
        description: "Kärryn tunniste."
      - name: aika
        description: "Aikaleima (Europe/Helsinki-aikavyöhyke)."
      - name: dt
        description: "Havaintopäivämäärä (DATE), johdettu aika-sarakkeesta."
      - name: hour
        description: "Havaintotunti (0–23), johdettu aika-sarakkeesta."
      - name: x
        description: "X-koordinaatti (cm)."
      - name: y
        description: "Y-koordinaatti (cm)."
      - name: q
        description: "Signaalin laatu (0–255, suurempi = parempi)."
      - name: speed_mps
        description: "Laskettu nopeus edellisestä havainnosta (m/s)."
      - name: sekuntia_edellisesta
        description: "Aika edellisestä havainnosta sekunteina."
      - name: is_low_quality
        description: "1 jos q-arvo on alle asetetun laaturajan (q < 35)."
      - name: is_out_of_bounds
        description: "1 jos x/y-koordinaatit ovat kaupan seinien ulkopuolella."
      - name: is_jitter
        description: "1 jos kärry on siirtynyt epäfysikaalisella nopeudella (> 3.5 m/s)."
      - name: is_night_time
        description: "1 jos havainto tehtiin kaupan aukioloaikojen ulkopuolella (ennen klo 7 tai klo 22 jälkeen)."
