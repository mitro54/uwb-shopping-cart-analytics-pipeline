version: 2

models:
  - name: silver_positions
    description: "Puhdistettu ja rikastettu sijaintidata. Sisältää geofencing-rajaukset, jitter-suodatuksen ja sessionization-logiikan."
    columns:
      - name: node_id
        description: "Kärryn yksilöllinen tunniste."
      - name: aika
        description: "Puhdistettu havaintoajankohta."
      - name: x
        description: "X-koordinaatti (cm)."
      - name: y
        description: "Y-koordinaatti (cm)."
      - name: q
        description: "Signaalin laatu."
      - name: dt
        description: "Aika päivämääränä (DATE)."
      - name: hour
        description: "Havainnon tunti (0-23)."
      - name: weekday
        description: "Viikonpäivä (1=Ma..7=Su)."
      - name: session_id
        description: "Kärrykohtainen juokseva sessionumero."
      - name: full_session_id
        description: "Maailmanlaajuisesti uniikki MD5-tunniste sessiolle (node_id + session_id)."
        tests:
          - not_null
      - name: dist_m
        description: "Matka edellisestä havainnosta metreinä."
      - name: sekuntia_edellisesta
        description: "Aika edellisestä havainnosta sekunteina."
      - name: speed_mps
        description: "Laskettu nopeus (m/s)."
