services:
  analytics:
    build: .
    container_name: bytebuddies-analytics
    working_dir: /app
    tty: true
    stdin_open: true
    volumes:
      # koko repo konttiin
      - .:/app
      # dbt-profiilit (DuckDB yhteys)
      - ~/.dbt:/root/.dbt
      # data-kansio erikseen
      - ./data:/app/data
    environment:
      # esimerkki: polku CSV:ille dbt-mallien env_var-käyttöä varten
      UWB_POSITIONS_CSV: /app/data/raw/positions.csv
    # halutessa voi antaa suoraan dbt-komennon:
    # command: ["dbt", "build", "--project-dir", "dbt"]
